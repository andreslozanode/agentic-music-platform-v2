[project]
name = "autonomous-agent"
version = "0.1.0"
description = "Level 3 - governed autonomous agent: LangGraph, RAG on Qdrant, Delta medallion lakehouse, AI governance."
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-core",
    "music-agent",
    "langgraph>=0.2",
    "qdrant-client>=1.12",
    "deltalake>=0.20",
    "pyarrow>=17",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "pyyaml>=6.0",
    "pyjwt[crypto]>=2.9",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
fastembed = ["fastembed>=0.4"]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.27"]

[project.scripts]
autonomous-agent = "autonomous_agent.cli:app"

[tool.uv.sources]
agent-core = { workspace = true }
music-agent = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonomous_agent"]
