{{- if .Values.secrets.externalSecrets.enabled }}
{{- $es := .Values.secrets.externalSecrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "agentic.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentic.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ include "agentic.fullname" . }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $es.keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ printf "%s-%s" $es.remoteKeyPrefix (. | lower | replace "_" "-") }}
    {{- end }}
{{- end }}
