{{- $sel := dict "root" . "component" "api" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentic.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentic.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "agentic.selector" $sel | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ .Values.api.metricsPort }}
      targetPort: metrics
      protocol: TCP
