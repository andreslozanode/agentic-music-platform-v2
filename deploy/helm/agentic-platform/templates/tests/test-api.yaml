{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "agentic.fullname" . }}-test-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentic.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    checkov.io/skip1: CKV_K8S_8=helm test hook runs to completion; liveness does not apply
    checkov.io/skip2: CKV_K8S_9=helm test hook runs to completion; readiness does not apply
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: smoke
      image: {{ include "agentic.apiImage" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["python", "-c"]
      args:
        - |
          import urllib.request, urllib.error, sys
          base = "http://{{ include "agentic.fullname" . }}-api:{{ .Values.service.port }}"
          assert urllib.request.urlopen(base + "/healthz", timeout=10).status == 200
          try:
              urllib.request.urlopen(urllib.request.Request(base + "/v1/ask", data=b'{"query":"x"}',
                  headers={"Content-Type": "application/json"}), timeout=10)
              sys.exit("unauthenticated request was accepted")
          except urllib.error.HTTPError as e:
              assert e.code == 401, e.code
          print("helm test ok")
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 200m, memory: 128Mi }
{{- end }}
