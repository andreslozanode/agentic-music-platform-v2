# AI governance policy-as-code. Changes require CODEOWNERS approval (governance team).
# A copy is rendered into the Helm chart; CI fails if the two drift (make policy-check).
version: 1
name: music-intelligence-default
owner: ai-governance@example.org
risk_tier: limited  # EU AI Act: transparency obligations (AI disclosure) apply

llm:
  allowed_providers:
    dev: [anthropic, openai_compatible, heuristic]
    ci: [heuristic, anthropic, openai_compatible]
    staging: [anthropic, openai_compatible, heuristic]
    prod: [anthropic, openai_compatible]
  max_tokens_per_run: 40000

data:
  allowed_music_modes:
    dev: [live, fixtures]
    ci: [fixtures]
    staging: [live, fixtures]
    prod: [live]
  classifications_for_llm: [public, internal]
  retention_days:
    bronze: 90
    audit: 365

tools:
  allowed:
    - get_latest_releases
    - get_new_artists
    - get_playlists
    - get_global_top_chart
    - search_spotify_tracks
    - search_knowledge_base
  require_approval: [publish_report]
  max_calls_per_run: 8

guardrails:
  max_input_chars: 2000
  injection_threshold: 0.6
  injection_action: block      # block | flag
  pii_action: redact           # redact | block
  require_grounding: true
  blocked_topics:
    - "track down (a|the) (user|person)"
    - "home address of"
    - "(doxx|dox)"
    - "how to (pirate|crack|rip) (music|spotify)"

responsible_ai:
  max_hhi: 0.15                # artist concentration in the chart (0-1)
  max_top_artist_share: 0.20
  min_cross_source_overlap: 0.05
  disclosure: >-
    This answer was generated by an AI agent from ListenBrainz, Deezer and optional
    Spotify data. Charts reflect those platforms' users, not official industry charts.

autonomy:
  auto_approve:
    dev: [publish_report]
    ci: [publish_report]
    staging: []
    prod: []
  max_cycle_seconds: 900

evaluation:
  min_redteam_block_rate: 0.95
  max_false_positive_rate: 0.10
  min_tool_selection_accuracy: 0.80
  min_grounded_rate: 0.90
