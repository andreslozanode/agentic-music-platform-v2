# Namespaces enforce the "restricted" Pod Security Standard (in addition to Kyverno).
apiVersion: v1
kind: Namespace
metadata:
  name: agentic-staging
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    agentic.example.org/signed-images-only: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: agentic-prod
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    agentic.example.org/signed-images-only: "true"
