[project]
name = "agent-core"
version = "0.1.0"
description = "Shared primitives for the agentic platform: LLM providers, tool registry, agent loop, hardened HTTP."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.4",
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]
